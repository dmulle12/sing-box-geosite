name: Config Update

on:
  push:
    branches:
      - main
      - feat/surge-list-generation
    paths-ignore:
      - "rule/**"

  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sing-box
        env:
          SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.10.0-alpha.27/sing-box_1.10.0-alpha.27_linux_amd64.deb"
        run: |
          set -Eeuo pipefail
          wget -O sing-box.deb "$SING_BOX_DEB_URL"
          sudo dpkg -i sing-box.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyyaml

      - name: Download AdGuard content
        run: |
          set -Eeuo pipefail

          URL="https://raw.githubusercontent.com/AdguardTeam/AdguardFilters/master/BaseFilter/sections/adservers.txt"
          OUTPUT_FILE="./rule/adservers.txt"

          curl -fL "$URL" -o "$OUTPUT_FILE"

          if [ -s "$OUTPUT_FILE" ]; then
            echo "Download successful: $OUTPUT_FILE"
          else
            echo "Download failed or file is empty."
            exit 1
          fi

      - name: Convert AdGuard DNS Filter to sing-box rule set
        run: |
          sing-box rule-set convert \
            --type adguard \
            --output ./rule/adservers.srs \
            ./rule/adservers.txt

      - name: Generate JSON, SRS and Surge LIST rules
        run: |
          python ../main.py
        working-directory: ./rule/

      - name: Check generated files
        run: |
          echo "Generated files:"
          find ./rule -maxdepth 1 -type f \( \
            -name "*.json" -o \
            -name "*.srs" -o \
            -name "*.list" \
          \) -print

      - name: Commit and push generated rules
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          git add ./rule/*.json
          git add ./rule/*.srs
          git add ./rule/*.list
          git add ./rule/*.txt

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update generated rules"
          git push
